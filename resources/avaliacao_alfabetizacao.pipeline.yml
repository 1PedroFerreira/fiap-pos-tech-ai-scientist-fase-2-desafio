resources:
  pipelines:
    avaliacao_alfabetizacao:
      name: Avaliação da Alfabetização — Pipeline Medalhão

      # Catálogo e schema onde as tabelas bronze/silver/gold são publicadas
      catalog: ${var.catalog}
      target: ${var.schema}

      libraries:
        - glob:
            include: ../src/transformations/**

      root_path: ../src/transformations

      serverless: true

      # Pipeline disparado (updates manuais ou agendados), não contínuo
      continuous: false
      development: true
      photon: true

      channel: current
