bundle:
  name: avaliacao_alfabetizacao

include:
  - resources/*.yml

variables:
  catalog:
    description: Catálogo Unity Catalog de destino (precisa existir no workspace Azure)
    default: workspace
  schema:
    description: Schema de destino no catálogo
    default: default
  warehouse_id:
    description: ID do SQL warehouse usado pelo dashboard (obrigatório no deploy)

targets:
  azure:
    default: true
    mode: development
